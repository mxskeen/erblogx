name: Scheduled Blog Scraper & Indexer

on:
  workflow_dispatch:
    inputs:
      limit_feeds:
        description: 'Limit number of feeds to test (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (do not insert into database)'
        type: boolean
        required: false
        default: false

  schedule:
    # Runs every Sunday at 03:00 UTC (weekly)
    - cron: '0 3 * * 0'

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  scrape-and-index:
    name: Scrape & Index Articles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Dependencies
        run: |
          cd backend
          poetry install --only=main --no-root

      - name: Run Scraper Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          ARGS=""
          if [ "${{ inputs.limit_feeds }}" != "" ]; then
            ARGS="$ARGS --limit-feeds ${{ inputs.limit_feeds }}"
          fi
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          poetry run python scraper.py $ARGS